name: Android Fastlane with Firebase App Distribution Workflow

on:
  push:
    branches:
      - main

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ✅ FIX 1: Create the .env file from GitHub Secret BEFORE any Flutter command
      # Your pubspec.yaml declares .env as an asset for flutter_dotenv.
      # It's gitignored so CI never has it — we recreate it here from a secret.
      # Go to: GitHub repo → Settings → Secrets → Actions → New secret
      # Name: ENV_FILE
      # Value: paste the entire contents of your local .env file
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE}}
          EOF

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create Google Services JSON files
        run: |
          mkdir -p android/app/src/development
          mkdir -p android/app/src/production
          echo "${{ secrets.GOOGLE_SERVICES_DEVELOPMENT }}" > android/app/src/development/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_PRODUCTION }}" > android/app/src/production/google-services.json

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler-cache: true
          working-directory: android

      - name: Build and Distribute App to Firebase
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          # ✅ FIX 2: Pass the project root path so Fastlane knows where to run Flutter from
          PROJECT_ROOT: ${{ github.workspace }}
        run: bundle exec fastlane android release_to_firebase
        working-directory: android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*.apk